name: Generate pink snake animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: zubaida-haydari
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#7dd3fc&color_dots=#161b22,#1e3a5f,#2563eb,#60a5fa,#bae6fd

      - name: Publish snake.svg
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
